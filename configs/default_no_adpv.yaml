pipeline:
  voxel_size: 0.005
  output_dir: output
  seed: 0
  deterministic: true
  strict_deterministic: false
preprocess:
  sor_enable: true
  sor_neighbors: 10
  sor_std_ratio: 3.5
  ground_removal:
    enable: true
    method: ransac
    fit_percentile: 20
    ransac_thresh: 0.015
    remove_thresh: 0.025
    dtm_grid:
      cell_size: 0.06
      z_percentile: 10.0
      min_points_per_cell: 3
      max_above_ground: 0.025
      below_margin: 0.03
      smooth_sigma_m: 0.05
      fit_low_percentile: 20
segmentation:
  backbone: pointnet2
  method: hybrid
  proposal_selection: nms
  block_inference:
    enable: true
    block_size: 2.0
    overlap: 0.5
    max_single_extent: 8.0
    merge_iou_thresh: 0.25
  pointgroup_config: PointGroup_Ours/config/pointgroup_cabbage.yaml
  softgroup_config: SoftGroup_Ours/config/softgroup_cabbage.yaml
  pg_score_thresh: 0.05
  pg_npoint_thresh: 20
  pg_sem_thresh: 0
  iach:
    eps: 0.05
    min_samples: 100
  post_semantic_filter:
    enable: false
    z_percentile: 0
    radius_outlier_radius: 0.03
    radius_outlier_min_neighbors: 8
instance:
  method: watershed_3d
  watershed_3d:
    voxel_resolution: 0.01
    min_seed_distance: 0.3
    smoothing_sigma: 1
    dilation_iters: 1
    peak_threshold_abs_m: 0.006
    peak_threshold_rel: 0.05
    max_seeds: 0
    max_voxels: 50000000
  graph_based:
    n_neighbors: 30
    distance_threshold: 0.05
    linkage: average
  meanshift:
    bandwidth: 0.25
    bin_seeding: true
    min_bin_freq: 10
  euclidean:
    tolerance: 0.05
    min_cluster_size: 50
  dbscan:
    eps: 0.05
    min_samples: 10
  hdbscan:
    min_cluster_size: 500
    min_samples: 10
  pg_expand:
    radius: 0.02
  precluster_filter:
    enable: true
    eps: 0.03
    min_points: 10
    post_density_check:
      enable: true
      min_linear_density: 500
      min_pts_absolute: 100
  pca_split:
    enable: false
    abnormal_diameter: 0.6
    abnormal_aspect_ratio: 1.6
    skeleton_bins: 15
    min_peak_dist_m: 0.35
    valley_depth_rel: 0.9
    merge_min_diameter: 0.45
    merge_max_dist: 0.3
    merge_max_angle: 50
  fragment_voting:
    enable: false
    discard_threshold: 500
    merge_threshold: 1500
    fragment_merge_max_dist: 0.15
  min_cluster_points: 2000
  max_cluster_points: 100000
  noise_reassign_radius: 0.1
evaluation:
  iou_thresh: 0.5
traits:
  height_percentile_low: 1
  height_percentile_high: 99
  outlier_filter:
    enable: true
    mad_thresh: 3.5
    min_points: 100
  alpha_shape_radius: 0.03
