# PointNet2 + Watershed 3D 消融: GIDM 四组件 (无邻域投票 KNN)
# 语义分割 = PointNet2, 聚类 = Watershed 3D
# 用 tools/pointnet2_real_eval.py 运行

pipeline:
  voxel_size: 0.005
  output_dir: "output"
  seed: 0
  deterministic: true
  strict_deterministic: false

preprocess:
  sor_enable: true
  sor_neighbors: 10
  sor_std_ratio: 3.5
  ground_removal:
    enable: true
    fit_percentile: 15
    ransac_thresh: 0.015
    remove_thresh: 0.02

segmentation:
  backbone: "pointnet2"
  method: "clustering"
  block_inference:
    enable: true
    block_size: 1.0
    overlap: 0.5

instance:
  method: "watershed_3d"

  watershed_3d:
    voxel_resolution: 0.01
    min_seed_distance: 0.3
    smoothing_sigma: 1
    dilation_iters: 1
    peak_threshold_abs_m: 0.006
    peak_threshold_rel: 0.05
    max_seeds: 0
    max_voxels: 50000000

  precluster_filter:
    enable: true
    eps: 0.03
    min_points: 10
    post_density_check:
      enable: true
      min_linear_density: 500
      min_pts_absolute: 100

  pca_split:
    enable: true               # GIDM (PCA 骨架拆分) 开启
    abnormal_diameter: 0.60
    abnormal_aspect_ratio: 1.60
    skeleton_bins: 15
    min_peak_dist_m: 0.30
    valley_depth_rel: 0.90
    merge_min_diameter: 0.45
    merge_max_dist: 0.30
    merge_max_angle: 50
    abnormal_detect: true
    skeleton_cut: true
    adaptive_thresh: true
    merge_back: true

  fragment_voting:
    enable: false              # 消融: 邻域投票 (KNN 合并碎片) 关闭
    discard_threshold: 500
    merge_threshold: 1500

  min_cluster_points: 2000
  max_cluster_points: 100000

evaluation:
  iou_thresh: 0.5

traits:
  height_percentile_low: 1
  height_percentile_high: 99
