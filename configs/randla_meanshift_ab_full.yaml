# RandLA-Net + MeanShift 消融: 完整方案 (GIDM 四组件 + 邻域投票 KNN)
# 语义分割 = RandLA-Net, 聚类 = MeanShift

pipeline:
  voxel_size: 0.005
  output_dir: "output"
  seed: 0
  deterministic: true
  strict_deterministic: false

preprocess:
  sor_enable: true
  sor_neighbors: 10
  sor_std_ratio: 3.5
  ground_removal:
    enable: true
    fit_percentile: 15
    ransac_thresh: 0.015
    remove_thresh: 0.02

segmentation:
  backbone: "randlanet"
  method: "clustering"
  proposal_selection: "nms"
  block_inference:
    enable: true
    block_size: 2.0
    overlap: 0.5
    max_single_extent: 8.0
    merge_iou_thresh: 0.25

instance:
  method: "meanshift"

  meanshift:
    bandwidth: 0.25
    bin_seeding: true
    min_bin_freq: 10

  precluster_filter:
    enable: true
    eps: 0.03
    min_points: 10
    post_density_check:
      enable: true
      min_linear_density: 500
      min_pts_absolute: 100

  pca_split:
    enable: true               # GIDM (PCA 骨架拆分) 开启
    abnormal_diameter: 0.60
    abnormal_aspect_ratio: 1.60
    skeleton_bins: 15
    min_peak_dist_m: 0.30
    valley_depth_rel: 0.90
    merge_min_diameter: 0.45
    merge_max_dist: 0.30
    merge_max_angle: 50
    abnormal_detect: true
    skeleton_cut: true
    adaptive_thresh: true
    merge_back: true

  fragment_voting:
    enable: true               # 完整: 邻域投票 (KNN 合并碎片) 开启
    discard_threshold: 500
    merge_threshold: 1500

  min_cluster_points: 2000
  max_cluster_points: 100000

evaluation:
  iou_thresh: 0.5

traits:
  height_percentile_low: 1
  height_percentile_high: 99
